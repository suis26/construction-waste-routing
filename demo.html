<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>建筑垃圾运输调度 Demo</title>
<style>
/* ===== 和風デザイン: washi paper, sumi ink, restrained ===== */
:root{
  --washi:#f7f5f0; --washi-2:#fbfaf7; --washi-3:#efece5;
  --sumi:#242220; --sumi-2:#4a4744; --nezumi:#8a8681; --nezumi-2:#b5b0a8;
  --hair:#dcd7cd; --hair-2:#e8e4dc;
  --ai:#2f4a68; --ai-2:#41648a;
  --koke:#6d7f5c; --kaki:#b95c33; --shu:#a63d34; --kin:#9c8350;
  --panel:#fbfaf7; --chip:#f0ece4;
  --serif:"Yu Mincho","Hiragino Mincho ProN","Songti SC","SimSun",serif;
  --sans:"Yu Gothic","Hiragino Kaku Gothic ProN","Microsoft YaHei","PingFang SC",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font:13.5px/1.75 var(--sans);
  color:var(--sumi);
  background:var(--washi);
  background-image:radial-gradient(var(--hair-2) 0.5px, transparent 0.5px);
  background-size:22px 22px;
  -webkit-font-smoothing:antialiased;
}
#srs-demo{max-width:1320px;margin:0 auto;padding:22px 22px 40px}
.num{font-variant-numeric:tabular-nums}

#srs-demo h2{font-family:var(--serif);font-size:16px;font-weight:600;margin:0 0 12px;letter-spacing:.05em}
.srs-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-bottom:14px;margin-bottom:18px;border-bottom:1px solid var(--hair)}
.srs-title{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:.08em;margin-right:auto;color:var(--sumi)}
.srs-title small{display:block;font-family:var(--sans);font-size:10.5px;font-weight:400;letter-spacing:.22em;color:var(--nezumi);margin-top:3px}
.srs-cities{display:flex;gap:6px;flex-wrap:wrap}
.srs-cities button{
  font-family:var(--serif);font-size:13px;letter-spacing:.1em;color:var(--sumi-2);
  background:transparent;border:1px solid var(--hair);border-radius:2px;
  padding:6px 15px;cursor:pointer;transition:all .18s ease;
}
.srs-cities button:hover{border-color:var(--nezumi-2);background:var(--washi-3)}
.srs-cities button[aria-pressed=true]{background:var(--ai);border-color:var(--ai);color:#fdfcf9}
.srs-badge{
  font-size:10.5px;letter-spacing:.06em;color:var(--kin);
  background:transparent;border:1px solid #e3d9c0;border-radius:2px;padding:3px 9px;
}
.srs-main{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(360px,1fr);gap:20px;align-items:start}
.srs-map{
  border:1px solid var(--hair);border-radius:3px;background:var(--washi-2);
  padding:12px;min-height:460px;position:relative;
  box-shadow:0 1px 0 rgba(36,34,32,.04);
}
.srs-map svg{display:block;width:100%;height:auto}
.srs-map .dist{fill:#f1eee7;stroke:var(--nezumi-2);stroke-width:.5}
.srs-map .dist.hl{fill:#e6ebef}
.srs-map .grid{stroke:#e6e2d9;stroke-width:.35}
.srs-map .route{fill:none;stroke-width:1.3;opacity:.5;pointer-events:stroke;cursor:pointer}
.srs-map .route.hl{stroke-width:2.6;opacity:.95}
.srs-map .route.cand{stroke-dasharray:3 3;opacity:.16}
.srs-map .pt{cursor:pointer;stroke:#fdfcf9;stroke-width:1.2}
.srs-map .pt.sel{stroke:var(--sumi);stroke-width:2}
.srs-map .fac{stroke:#fdfcf9;stroke-width:1.2;cursor:pointer}
.srs-map .fac.sel{stroke:var(--sumi);stroke-width:2}
.srs-map .lbl{font-family:var(--sans);font-size:8.5px;letter-spacing:.04em;fill:var(--sumi-2);pointer-events:none}
.srs-legend{display:flex;flex-wrap:wrap;gap:10px;font-size:10.5px;color:var(--nezumi);margin-top:10px;padding-top:10px;border-top:1px solid var(--hair-2)}
.srs-legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:0}
.srs-side{
  border:1px solid var(--hair);border-radius:3px;background:var(--washi-2);
  padding:18px 20px;max-height:740px;overflow:auto;
  box-shadow:0 1px 0 rgba(36,34,32,.04);
}
.srs-sec{padding:14px 0;border-top:1px solid var(--hair-2)}
.srs-sec:first-child{border-top:0;padding-top:0}
.srs-sec h3{font-family:var(--serif);font-size:13px;font-weight:600;letter-spacing:.06em;margin:0 0 8px;color:var(--ai)}
.srs-row{font-size:12px;line-height:1.7;padding:4px 0;border-bottom:1px dotted var(--hair-2);color:var(--sumi-2)}
.srs-row:last-child{border-bottom:0}
.srs-row b{font-weight:600;color:var(--sumi)}
.srs-row code{font-family:Consolas,Menlo,monospace;font-size:11px;background:var(--chip);padding:1px 5px;border-radius:2px;color:var(--ai)}
.srs-ok{color:var(--koke)} .srs-no{color:var(--shu)} .srs-dim{color:var(--nezumi)}
.srs-log{
  cursor:pointer;border-radius:2px;padding:5px 9px;margin:3px 0;
  background:transparent;border-left:2px solid var(--hair);
  font-size:11.5px;line-height:1.6;transition:all .15s ease;
}
.srs-log:hover{background:var(--chip)}
.srs-log.hl{border-left-color:var(--ai);background:#e9eef3}
.srs-log.acc{border-left-color:var(--koke);background:#eef1e9}
.srs-kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:12px;line-height:1.7}
.srs-kv span:nth-child(odd){color:var(--nezumi);font-family:var(--serif);letter-spacing:.04em}
.srs-back{
  font-family:var(--serif);font-size:12px;letter-spacing:.06em;color:var(--ai);
  background:transparent;border:1px solid var(--hair);border-radius:2px;
  padding:5px 13px;cursor:pointer;margin-bottom:12px;transition:all .18s ease;
}
.srs-back:hover{border-color:var(--ai);background:var(--chip)}
.srs-empty{color:var(--nezumi);font-size:12px;padding:8px 0}
.srs-del{cursor:pointer;color:var(--shu);font-size:11px;margin-left:6px;opacity:.7}
.srs-del:hover{opacity:1;text-decoration:underline}
.srs-candbtn{
  font-family:var(--sans);font-size:11px;color:var(--ai);
  background:transparent;border:1px solid var(--hair);border-radius:2px;
  padding:3px 10px;cursor:pointer;margin:3px 4px 0 0;transition:all .15s ease;
}
.srs-candbtn:hover{border-color:var(--ai);background:var(--chip)}
.srs-addbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.srs-addbar select{
  font-family:var(--sans);font-size:12px;color:var(--sumi);
  background:var(--washi-2);border:1px solid var(--hair);border-radius:2px;padding:4px 8px;
}
.srs-note{font-size:11px;color:var(--nezumi);letter-spacing:.02em}
.srs-kicker{font-family:var(--serif);font-size:11px;letter-spacing:.24em;color:var(--kin);margin-bottom:6px}
@media(max-width:960px){.srs-main{grid-template-columns:1fr}.srs-side{max-height:none}}

.srs-topbtn{font-family:var(--serif);font-size:12px;letter-spacing:.08em;color:var(--ai);background:transparent;border:1px solid var(--hair);border-radius:2px;padding:6px 14px;cursor:pointer;transition:all .18s ease}
.srs-topbtn:hover{border-color:var(--ai);background:var(--chip)}

.srs-map .cand-dot{cursor:pointer;fill:none;stroke:var(--kaki);stroke-width:2;stroke-dasharray:3 2;pointer-events:all}
.srs-map .cand-dot:hover{fill:#f6ece4}

/* ===== dynamic map + direct/optimized comparison ===== */
.srs-viewbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.srs-vbtn{font-family:var(--serif);font-size:12px;letter-spacing:.08em;color:var(--sumi-2);background:transparent;border:1px solid var(--hair);border-radius:2px;padding:5px 13px;cursor:pointer;transition:all .18s ease}
.srs-vbtn:hover{border-color:var(--nezumi-2);background:var(--washi-3)}
.srs-vbtn[aria-pressed=true]{background:var(--ai);border-color:var(--ai);color:#fdfcf9}
/* 线路：静态底线 + 只描一次的描线层 + 描完以后沿线流动的流动层（不使用移动圆点，避免与设施混淆） */
.srs-map .route-base{fill:none;opacity:.12;pointer-events:stroke;cursor:pointer}
.srs-map .route-base.hl{opacity:.55;stroke-width:2.8}
.srs-map .route-draw{fill:none;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;opacity:1;animation-name:routedraw,routetrack;animation-timing-function:ease-out,ease;animation-fill-mode:forwards,forwards}
@keyframes routedraw{to{stroke-dashoffset:0}}
@keyframes routetrack{to{opacity:.34}}
.srs-map .route-flow{fill:none;stroke-linecap:round;stroke-dasharray:9 21;opacity:0;animation-name:flowin,routeflow;animation-duration:.4s,1.4s;animation-timing-function:ease,linear;animation-iteration-count:1,infinite;animation-fill-mode:forwards,none}
@keyframes flowin{to{opacity:1}}
@keyframes routeflow{to{stroke-dashoffset:-32}}
@media (prefers-reduced-motion: reduce){
  .srs-map .route-draw{animation:none;stroke-dashoffset:0}
  .srs-map .route-flow{animation:none;opacity:.5}
}
.srs-compare{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
@media(max-width:1080px){.srs-compare{grid-template-columns:1fr}}
.srs-cmpcard{border:1px solid var(--hair);border-radius:3px;background:var(--washi-2);padding:10px 12px}
.srs-cmpcard h4{font-family:var(--serif);font-size:13px;font-weight:600;letter-spacing:.06em;margin:0 0 6px;color:var(--ai);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.srs-cmpcard h4 span{font-family:var(--sans);font-size:10.5px;font-weight:400;color:var(--nezumi);letter-spacing:.02em}
.srs-cmpcard .srs-map{border:0;padding:0;min-height:0;box-shadow:none;background:transparent}
.srs-cmpstats{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:2px 10px;font-size:11px;color:var(--sumi-2);margin-top:8px;padding-top:8px;border-top:1px solid var(--hair-2)}
.srs-cmpstats b{color:var(--sumi);font-variant-numeric:tabular-nums}
.srs-delta{display:grid;grid-template-columns:auto 1fr auto auto;gap:4px 12px;font-size:12px;align-items:baseline}
.srs-delta .k{color:var(--nezumi);font-family:var(--serif);letter-spacing:.04em}
.srs-delta .v{font-variant-numeric:tabular-nums}
.srs-delta .down{color:var(--koke);font-weight:600}
.srs-delta .up{color:var(--shu);font-weight:600}
.srs-cmpbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.srs-bars{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.srs-bar{display:grid;grid-template-columns:52px 1fr 78px;gap:8px;align-items:center;font-size:11px;color:var(--sumi-2)}
.srs-bar .track{height:9px;background:var(--washi-3);border-radius:5px;overflow:hidden;display:flex}
.srs-bar .f1{background:var(--kaki);height:100%}
.srs-bar .f2{background:var(--ai);height:100%}
.srs-bar .val{text-align:right;font-variant-numeric:tabular-nums}

</style>
</head>

    infeasible: ok.filter(function (r) { return !r.feasible; }).length
  };
}

/* ===== render helpers ===== */
function svgEl(tag, attrs) {
  const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}
function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}
function num(n, d) { return Number(n).toFixed(d === undefined ? 0 : d); }

function projectAll(geo, W, H, pad) {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  function walk(c) {
    if (typeof c[0] === 'number') {
      if (c[0] < x0) x0 = c[0]; if (c[0] > x1) x1 = c[0];
      if (c[1] < y0) y0 = c[1]; if (c[1] > y1) y1 = c[1];
    } else c.forEach(walk);
  }
  geo.districts.forEach(function (d) { walk(d.geometry.coordinates); });
  const gw = x1 - x0, gh = y1 - y0;
  const sx = (W - pad * 2) / gw, sy = (H - pad * 2) / gh;
  const s = Math.min(sx, sy);
  const ox = (W - gw * s) / 2 - x0 * s, oy = (H - gh * s) / 2 + y1 * s;
  return {
    x: function (lng) { return lng * s + ox; },
    y: function (lat) { return -lat * s + oy; },
    s: s, W: W, H: H, ox: ox, oy: oy
  };
}
function ringsOf(g) { return g.type === 'Polygon' ? [g.coordinates[0]] : g.coordinates.map(function (p) { return p[0]; }); }
function pathOf(g, pr) {
  let d = '';
  ringsOf(g).forEach(function (r) {
    r.forEach(function (c, i) {
      d += (i ? 'L' : 'M') + num(pr.x(c[0]), 1) + ' ' + num(pr.y(c[1]), 1) + ' ';
    });
    d += 'Z ';
  });
  return d;
}
function pointInRings(lng, lat, g) {
  function inRing(r) {
    let inside = false;
    for (let i = 0, j = r.length - 1; i < r.length; j = i++) {
      const xi = r[i][0], yi = r[i][1], xj = r[j][0], yj = r[j][1];
      if (((yi > lat) !== (yj > lat)) && (lng < (xj - xi) * (lat - yi) / (yj - yi) + xi)) inside = !inside;
    }
    return inside;
  }
  return ringsOf(g).some(inRing);
}

function invertTo(px, py, pr) {
  const s = pr.s;
  const ox = pr.ox, oy = pr.oy;
  const lng = (px - ox) / s;
  const lat = (oy - py) / s;
  return { lng: lng, lat: lat };
};

/* ===== map rendering ===== */
var SVG_W = 720, SVG_H = 540, SVG_PAD = 26;
var KIND_LABEL = { '资源化厂':'资源化厂', '消纳场':'消纳场', '金属回收':'金属回收', '分拣中转场':'分拣中转场', '泥浆预处理':'泥浆预处理', '土方平衡点':'土方平衡点' };

function tripPathD(r, state, pr) {
  const dp = state.dmap[r.depot];
  if (!dp) return "";
  let d = "M" + num(pr.x(dp.lng), 1) + " " + num(pr.y(dp.lat), 1);
  r.seq.forEach(function (s) {
    const o = state.omap[s.id];
    if (!o) return;
    d += " L" + num(pr.x(o.lng), 1) + " " + num(pr.y(o.lat), 1);
  });
  d += " L" + num(pr.x(dp.lng), 1) + " " + num(pr.y(dp.lat), 1);
  return d;
}
function directPathD(r, state, pr) {
  const dp = state.dmap[r.depot];
  const o = state.omap[r.seq[0].id];
  if (!dp || !o) return "";
  return "M" + num(pr.x(dp.lng), 1) + " " + num(pr.y(dp.lat), 1) +
         " L" + num(pr.x(o.lng), 1) + " " + num(pr.y(o.lat), 1) +
         " L" + num(pr.x(dp.lng), 1) + " " + num(pr.y(dp.lat), 1);
}

/* options: { routes, candidates, animate, compact, tag } */
function drawMap(host, state, options) {
  options = options || {};
  const routes = options.routes || state.solved.merged;
  const candidates = options.candidates || [];
  const animate = !!options.animate;
  const compact = !!options.compact;

  host.innerHTML = '';
  const svg = svgEl('svg', { viewBox: '0 0 ' + SVG_W + ' ' + SVG_H, role: 'img', 'aria-label': state.city.label + ' 建筑垃圾调度地图' });
  const pr = projectAll(state.geo, SVG_W, SVG_H, SVG_PAD);
  state.pr = pr;

  const defs = svgEl('defs');
  svg.appendChild(defs);

  // 经纬网格
  const g = svgEl('g');
  for (let i = 1; i < 6; i++) {
    const x = SVG_PAD + (SVG_W - SVG_PAD * 2) * i / 6;
    const y = SVG_PAD + (SVG_H - SVG_PAD * 2) * i / 6;
    g.appendChild(svgEl('line', { class: 'grid', x1: x, y1: SVG_PAD, x2: x, y2: SVG_H - SVG_PAD }));
    g.appendChild(svgEl('line', { class: 'grid', x1: SVG_PAD, y1: y, x2: SVG_W - SVG_PAD, y2: y }));
  }
  svg.appendChild(g);

  // 行政区界
  const dg = svgEl('g');
  state.geo.districts.forEach(function (d) {
    const p = svgEl('path', { class: 'dist', d: pathOf(d.geometry, pr) });
    p.appendChild(svgEl('title')).textContent = d.name;
    dg.appendChild(p);
  });
  svg.appendChild(dg);

  // 候选路线(未采纳试探)
  if (!compact) {
    const cg = svgEl('g');
    candidates.forEach(function (c) {
      const a = state.omap[c.a], b = state.omap[c.b];
      if (!a || !b) return;
      cg.appendChild(svgEl('line', {
        class: 'route cand', stroke: '#9aa7b8',
        x1: pr.x(a.lng), y1: pr.y(a.lat), x2: pr.x(b.lng), y2: pr.y(b.lat)
      }));
    });
    svg.appendChild(cg);
  }

  // 车次路线：静态底线 + 只描一次的描线层 + 描完以后沿线流动的流动层（不使用移动圆点，避免与设施混淆）
  const rg = svgEl('g');
  routes.forEach(function (r, idx) {
    const d = options.direct ? directPathD(r, state, pr) : tripPathD(r, state, pr);
    if (!d) return;
    const color = options.direct ? '#b95c33' : (CAT_COLOR[(state.omap[r.seq[0].id] || {}).cat] || '#4472c4');
    const hl = state.sel && state.sel.kind === 'trip' && !options.direct && state.sel.id === idx;
    const width = compact ? 1.3 : 1.6;
    const delay = (idx * 0.18).toFixed(2) + 's';
    const drawDur = Math.max(0.7, Math.min(2.2, 0.6 + (r.km || 5) * 0.012)).toFixed(2) + 's';
    const flowDelay = (parseFloat(delay) + parseFloat(drawDur)).toFixed(2) + 's';

    const base = svgEl('path', {
      class: 'route-base' + (hl ? ' hl' : ''),
      d: d,
      stroke: color,
      'stroke-width': width
    });
    base.appendChild(svgEl('title')).textContent = (options.direct ? '直送 ' : '车次 ' + (idx + 1) + ' ') +
      r.seq.map(function (s) { return s.id; }).join('→') + ' · ' + num(r.km, 1) + 'km · ' + num(r.total) + '元';
    if (!options.direct) base.addEventListener('click', function () { selectTrip(idx); });
    rg.appendChild(base);

    if (animate) {
      // 一次性描线：pathLength 归一化，dashoffset 从 1 到 0 只跑一次
      const settleDelay = (parseFloat(delay) + parseFloat(drawDur)).toFixed(2) + 's';
      const draw = svgEl('path', {
        class: 'route-draw',
        d: d,
        stroke: color,
        'stroke-width': width + 0.5,
        pathLength: 1,
        style: 'animation-delay:' + delay + ',' + settleDelay + ';animation-duration:' + drawDur + 's,.35s'
      });
      rg.appendChild(draw);

      // 描完之后：虚线沿线路持续流动
      const flow = svgEl('path', {
        class: 'route-flow',
        d: d,
        stroke: color,
        'stroke-width': compact ? 2.3 : 3.1,
        style: 'animation-delay:' + flowDelay + ', ' + flowDelay + ';animation-duration:.45s,' +
          Math.max(1.2, Math.min(3.0, 1.3 + (r.km || 5) * 0.014)).toFixed(2) + 's'
      });
      rg.appendChild(flow);
    }
  });
  svg.appendChild(rg);

  // 产生点(订单)
  const og = svgEl('g');
  state.orders.forEach(function (o) {
    const isManual = o.conf < state.params.confGate;
    const dot = svgEl('circle', {
      class: 'pt' + (state.sel && state.sel.kind === 'order' && state.sel.id === o.id ? ' sel' : ''),
      cx: pr.x(o.lng), cy: pr.y(o.lat), r: compact ? 3.8 : 4.5,
      fill: CAT_COLOR[o.cat] || '#4472c4',
      'fill-opacity': isManual ? 0.35 : 0.95
    });
    dot.appendChild(svgEl('title')).textContent = o.id + ' ' + o.cat + ' / ' + o.mat + ' · ' + o.tons + 't' + (isManual ? ' (转人工)' : '');
    dot.addEventListener('click', function (ev) { ev.stopPropagation(); selectOrder(o.id); });
    og.appendChild(dot);
  });
  svg.appendChild(og);

  // 候选点(仅新增模式可见)
  if (S.addMode && S.candSpots && !compact) {
    const cg2 = svgEl('g');
    S.candSpots.forEach(function (sp) {
      const ring = svgEl('circle', {
        class: 'cand-dot', cx: pr.x(sp.lng), cy: pr.y(sp.lat), r: 9,
        fill: 'none', stroke: '#b95c33', 'stroke-width': 2, 'stroke-dasharray': '3 2'
      });
      ring.appendChild(svgEl('title')).textContent = sp.district + ' · ' + sp.cat;
      ring.addEventListener('click', function (ev) { ev.stopPropagation(); addOrder(sp); });
      cg2.appendChild(ring);
    });
    svg.appendChild(cg2);
  }

  // 设施
  const fg = svgEl('g');
  state.facilities.forEach(function (f) {
    const c = svgEl('circle', {
      class: 'fac' + (state.sel && state.sel.kind === 'fac' && state.sel.id === f.id ? ' sel' : ''),
      cx: pr.x(f.lng), cy: pr.y(f.lat), r: compact ? 5 : 6, fill: KIND_COLOR[f.kind] || '#546e7a'
    });
    c.appendChild(svgEl('title')).textContent = f.id + ' ' + f.kind + ' (' + f.district + ') · 处理难度 ×' + num(f.difficulty_coeff, 2) + ' · 路况 ' + (f.road_condition || '一般') + '（速度 ×' + num(f.road_speed_factor, 2) + '）';
    c.addEventListener('click', function () { selectFacility(f.id); });
    fg.appendChild(c);
    const lbl = svgEl('text', { class: 'lbl', x: pr.x(f.lng) + 8, y: pr.y(f.lat) + 3 });
    lbl.textContent = f.id;
    fg.appendChild(lbl);
  });
  svg.appendChild(fg);

  if (!compact) {
    svg.addEventListener("click", function (ev) {
      if (!S.addMode) return;
      const rect = svg.getBoundingClientRect();
      const px = (ev.clientX - rect.left) / rect.width * SVG_W;
      const py = (ev.clientY - rect.top) / rect.height * SVG_H;
      const ll = invertTo(px, py, pr);
      let hit = null;
      for (const d of state.geo.districts) {
        if (pointInRings(ll.lng, ll.lat, d.geometry)) { hit = d; break; }
      }
      if (!hit) { S.flash = "落点不在本市范围内, 已忽略"; render(); return; }
      S.flash = "已在 " + hit.name + " 落点新增订单";
      addOrderAt(ll.lat, ll.lng, hit.name);
    });
  }
  host.appendChild(svg);
}
/* ===== direct vs optimized comparison + dynamic playback ===== */
function spanMinutes(routes, S) {
  const start = Math.min.apply(null, S.orders.map(function (o) { return o.ready; }));
  const finish = routes.reduce(function (mx, r) { return Math.max(mx, r.finish || 0); }, 0);
  return finish > 0 ? Math.max(0, finish - start) : 0;
}
function compareCard(title, note, routes, S, direct) {
  const card = el('div', 'srs-cmpcard');
  card.appendChild(el('h4', null, esc(title) + '<span>' + esc(note) + '</span>'));
  const map = el('div', 'srs-map');
  card.appendChild(map);
  const m = metrics(routes);
  const stats = el('div', 'srs-cmpstats');
  stats.innerHTML =
    '<span>成本</span><b>' + num(m.cost) + ' 元</b>' +
    '<span>里程</span><b>' + num(m.km, 1) + ' km</b>' +
    '<span>趟次</span><b>' + m.trips + ' 趟</b>' +
    '<span>碳排</span><b>' + num(m.co2, 1) + ' kg</b>';
  card.appendChild(stats);
  return { card: card, map: map, metrics: m };
}
function timeBarRow(label, min, max, value, cls) {
  return el('div', 'srs-bar',
    '<span>' + esc(label) + '</span>' +
    '<span class="track"><span class="' + cls + '" style="width:' + num(max > 0 ? value / max * 100 : 0, 1) + '%"></span></span>' +
    '<span class="val">' + num(value, 0) + ' min</span>');
}
function compareSection(S) {
  const w = el('div', 'srs-sec');
  const mb = S.solved.mBase, mm = S.solved.mMerged;
  const tBase = spanMinutes(S.solved.directPlan || S.solved.direct, S);
  const tOpt = spanMinutes(S.solved.optimizedPlan || S.solved.merged, S);
  w.appendChild(el('h3', null, '直送 / 优化对比'));
  w.appendChild(row('<span class="srs-dim">左：每单单独派车的点对点直送基线；右：本算法的合并优化方案。地图均为动态效果，圆点代表车辆沿线路循环行驶。</span>'));

  const cmp = el('div', 'srs-compare');
  const A = compareCard('点对点直送', '每单单独派车 · ' + mb.trips + ' 趟', S.solved.directPlan || S.solved.direct, S, true);
  const B = compareCard('算法优化后', '合并同向任务 · ' + mm.trips + ' 趟', S.solved.optimizedPlan || S.solved.merged, S, false);
  cmp.appendChild(A.card);
  cmp.appendChild(B.card);
  w.appendChild(cmp);

  const deltas = el('div', 'srs-delta');
  function drow(label, a, b, unit, d, lowerBetter) {
    const diff = b - a;
    const pct = a > 0 ? diff / a * 100 : 0;
    const better = lowerBetter ? diff < 0 : diff > 0;
    const cls = Math.abs(diff) < 1e-9 ? 'srs-dim' : (better ? 'down' : 'up');
    deltas.appendChild(el('span', 'k', esc(label)));
    deltas.appendChild(el('span', 'v', num(a, d) + ' → ' + num(b, d) + ' ' + unit));
    deltas.appendChild(el('span', 'v ' + cls, (diff > 0 ? '+' : '') + num(diff, d)));
    deltas.appendChild(el('span', 'v ' + cls, a > 0 ? (diff > 0 ? '+' : '') + num(pct, 1) + '%' : '—'));
  }
  drow('综合成本', mb.cost, mm.cost, '元', 0, true);
  drow('总里程', mb.km, mm.km, 'km', 1, true);
  drow('趟次', mb.trips, mm.trips, '趟', 0, true);
  drow('碳排', mb.co2, mm.co2, 'kg', 1, true);
  drow('完成耗时', tBase, tOpt, 'min', 0, true);
  w.appendChild(deltas);

  const bars = el('div', 'srs-bars');
  const maxCost = Math.max(mb.cost, mm.cost, 1);
  const maxKm = Math.max(mb.km, mm.km, 1);
  const maxCo2 = Math.max(mb.co2, mm.co2, 1);
  const maxTime = Math.max(tBase, tOpt, 1);
  function pairBar(label, a, b, maxv, d, unit) {
    bars.appendChild(el('div', 'srs-bar',
      '<span>' + esc(label) + '·直送</span>' +
      '<span class="track"><span class="f1" style="width:' + num(a / maxv * 100, 1) + '%"></span></span>' +
      '<span class="val">' + num(a, d) + ' ' + unit + '</span>'));
    bars.appendChild(el('div', 'srs-bar',
      '<span>' + esc(label) + '·优化</span>' +
      '<span class="track"><span class="f2" style="width:' + num(b / maxv * 100, 1) + '%"></span></span>' +
      '<span class="val">' + num(b, d) + ' ' + unit + '</span>'));
  }
  pairBar('成本', mb.cost, mm.cost, maxCost, 0, '元');
  pairBar('里程', mb.km, mm.km, maxKm, 1, 'km');
  pairBar('碳排', mb.co2, mm.co2, maxCo2, 1, 'kg');
  bars.appendChild(timeBarRow('耗时·直送', 0, maxTime, tBase, 'f1'));
  bars.appendChild(timeBarRow('耗时·优化', 0, maxTime, tOpt, 'f2'));
  w.appendChild(bars);

  w.appendChild(row('<span class="srs-ok">算法优化后：少 <b>' + num(mb.trips - mm.trips) + '</b> 趟 · 少 <b>' + num(mb.km - mm.km, 1) + '</b> km · 省 <b>' + num(mb.cost - mm.cost) + '</b> 元 · 少碳 <b>' + num(mb.co2 - mm.co2, 1) + '</b> kg</span>'));

  // 动态地图在两卡内绘制
  drawMap(A.map, S, { animate: true, direct: true, compact: true, routes: S.solved.directPlan || S.solved.direct, candidates: [] });
  drawMap(B.map, S, { animate: true, direct: false, compact: true, routes: S.solved.optimizedPlan || S.solved.merged, candidates: [] });
  return w;
}

/* ===== sidebar: global process view ===== */
function sec(title) {

}
function row(html) { return el('div', 'srs-row', html); }

    if (dEl) dEl.addEventListener('click', function (e) { e.stopPropagation(); removeOrder(o.id); });

  host.appendChild(w);

  // 4 接收匹配
  w = sec('4 接收匹配（材质 + 类别双重过滤）');
  S.orders.forEach(function (o) {
    const trace = R.matchTrace[o.id];
    w.appendChild(row('<code>' + o.id + '</code> ' + esc(o.cat) + ' / ' + esc(o.mat) + ' → ' +
      (trace.pass.length ? '<span class="srs-ok">可行 ' + trace.pass.map(function(d){return d.id;}).join(',') + '</span>' : '<span class="srs-no">无可行设施</span>')));
    trace.fail.forEach(function (f) {
      w.appendChild(row('<span class="srs-dim">　排除 ' + f.id + '（' + esc(f.kind) + '）：' + esc(f.why) + '</span>'));
    });
  });
  host.appendChild(w);

  // 5 直送基线
  w = sec('5 直送基线（每单单独派车）');
  R.direct.forEach(function (r) {
    w.appendChild(row('<code>' + r.seq[0].id + '</code> → ' + r.depot + ' · ' + num(r.km,1) + ' km · 行驶 <b>' + num(r.travel) + '</b> + 等待 ' + num(r.wait) + ' + 处置 ' + num(r.disposal) + ' + 违约 ' + num(r.late) + ' = <b>' + num(r.total) + '</b> 元'));
  });
  const mb = R.mBase;
  w.appendChild(row('<span class="srs-dim">合计 ' + mb.trips + ' 趟 · ' + num(mb.km,1) + ' km · <b>' + num(mb.cost) + '</b> 元</span>'));
  host.appendChild(w);
}


function renderTrace(host, S) {
  const R = S.solved;
  var w = sec('6 运行过程追踪（每一对试探）');
  w.appendChild(row('<span class="srs-dim">按轮次执行：本轮评估所有订单对 → 重新排程后续任务并估算总花费 → 选中对后续任务最有利的一对 → 合并后进入下一轮，直到无可合并。</span>'));
  R.trace.forEach(function (t) {
    w.appendChild(row('<b>第 ' + t.round + ' 轮</b> · 评估 ' + t.rows.length + ' 对' + (t.chosen ? ' · 采纳步骤 [' + t.chosen + ']' : ' · 无可合并，结束')));
    t.rows.forEach(function (r) {
      const cls = 'srs-log' + (r.accepted ? ' acc' : '');
      const line = el('div', cls, '[' + r.step + '] 试探 ' + r.pair.join('+') + ' → ' +
        (r.accepted
          ? '<b>' + r.depot + '</b>：即时净节约 ' + num(r.savingImmediate) + ' 元 + 后续任务预计变化 ' + num(r.futureDelta) + ' 元 = <b class="srs-ok">计划净改善 ' + num(r.saving) + ' 元 → 采纳</b>'
          : '<span class="srs-no">' + esc(r.why) + '</span>'));
      line.addEventListener('click', function () { selectStep(r.step); });
      if (S.sel && S.sel.kind === 'step' && S.sel.id === r.step) line.classList.add('hl');
      w.appendChild(line);
    });
  });
  host.appendChild(w);

  // 7 汇总
  w = sec('7 汇总（直送 vs 合车）');
  const mb = R.mBase, mm = R.mMerged;
  const tbl = function (label, a, b, unit, d) {
    return row('<b>' + label + '</b>：' + num(a, d) + ' → ' + num(b, d) + ' ' + unit +
      ' <span class="' + (b < a ? 'srs-ok' : 'srs-dim') + '">(' + (a > 0 ? ((b - a) / a * 100 >= 0 ? '+' : '') + num((b - a) / a * 100, 1) + '%' : '—') + ')</span>');
  };
  w.appendChild(tbl('综合成本', mb.cost, mm.cost, '元'));
  w.appendChild(tbl('总里程', mb.km, mm.km, 'km', 1));
  w.appendChild(tbl('趟次', mb.trips, mm.trips, '趟'));
  w.appendChild(tbl('碳排', mb.co2, mm.co2, 'kg', 1));
  w.appendChild(row('<span class="srs-dim">合车成本构成：行驶 ' + num(mm.travel) + ' + 等待 ' + num(mm.wait) + ' + 处置 ' + num(mm.disposal) + ' + 违约 ' + num(mm.late) + ' = ' + num(mm.cost) + ' 元</span>'));
  host.appendChild(w);

  // 7.5 任务覆盖保证
  w = sec('7.5 任务覆盖保证');
  w.appendChild(row('待处理任务 <b>' + R.coverage.total + '</b> 项 · 已进入最终计划 <b>' + R.coverage.scheduled + '</b> 项 · 未解决 <b class="' + (R.coverage.missing.length ? 'srs-no' : 'srs-ok') + '">' + R.coverage.missing.length + '</b> 项'));
  if (R.coverageAdded && R.coverageAdded.length) {
    R.coverageAdded.forEach(function (a) { w.appendChild(row('<code>' + a.id + '</code> 兜底排入 ' + a.depot + '：' + esc(a.reason))); });
  } else {
    w.appendChild(row('<span class="srs-ok">全部任务已由原调度结果覆盖，无需兜底追加。</span>'));
  }
  w.appendChild(row('<span class="srs-dim">覆盖原则：无论置信度高低、材质是否匹配、单车能否一次装载，最终计划都必须为每个待处理任务给出确定去向（必要时自动拆分多趟）。</span>'));
  host.appendChild(w);

  // 8 联单
  w = sec('8 电子联单（由调度解直接生成）');
  R.manifests.forEach(function (m) {
    w.appendChild(row('<code>' + m.no + '</code> 车次' + m.trip + ' · ' + esc(m.cat) + ' · ' + m.from + ' → ' + m.to + ' · ' + num(m.tons,1) + ' t · 到厂 ' + m.arrive));
  });
  host.appendChild(w);
}

function renderGlobalSide(host, S) {

  var w = sec('订单 ' + o.id + ' 完整推演');

    : '<span class="srs-no">置信度 ' + num(o.conf,2) + ' < 门槛 ' + num(p.confGate,2) + ' → 触发人工复核提示，但仍排入最终计划（不遗漏任何任务）</span>'));

  });
  mt.fail.forEach(function (f) {
    w.appendChild(row('<span class="srs-no">排除 ' + f.id + '（' + esc(f.kind) + '）：' + esc(f.why) + '</span>'));
  });
  if (!mt.pass.length) w.appendChild(row('<span class="srs-no">无任何设施可接收 → 无法进入调度</span>'));

    if (!auto) w.appendChild(row('<span class="srs-dim">原因：视觉置信度不足，已列入人工复核提示。</span>'));

    w.appendChild(row('并入 <b>车次 ' + (trip + 1) + '</b> → ' + r.depot + ' · 到达 ' + hhmm(s.at) + ' · 该车次装载率 ' + num(r.load / S.vmap[r.vehicle].cap_t * 100,0) + '%'));

      w.appendChild(row('<span class="srs-dim">该订单单独成趟，未参与合并。</span>'));

  host.appendChild(w);
}

function detailStep(host, S, R, sid) {
  var hit = null;

/* ===== main app ===== */
var S = {
  cityKey: 'beijing', city: null, geo: null, facilities: [], orders: [],
  vehicles: [], params: null, solved: null, sel: null, view: 'optimized',
  traceCandidates: [], omap: {}, dmap: {}, vmap: {}
};
var CITY_ORDER = ['beijing', 'shanghai', 'tianjin', 'shenzhen'];
var CITY_LABEL = { beijing: '北京', shanghai: '上海', tianjin: '天津', shenzhen: '深圳' };

function makeVehicles(city) {
  var fac = city.facilities;
  function pick(kind) { var f = fac.filter(function (x) { return x.kind === kind; })[0]; return f ? f.id : fac[0].id; }
  return [
    { id: 'V1', cap_t: 12, cap_m3: 16, start: pick('资源化厂'), avail: 480 },
    { id: 'V2', cap_t: 12, cap_m3: 16, start: pick('消纳场'), avail: 480 },
    { id: 'V3', cap_t: 8,  cap_m3: 10, start: pick('泥浆预处理'), avail: 510 },
    { id: 'V4', cap_t: 5,  cap_m3: 7,  start: pick('金属回收'), avail: 540 }
  ];
}

function buildMatchTrace(orders, facilities) {
  var tr = {};
  orders.forEach(function (o) {
    var pass = [], fail = [];
    var kinds = CATEGORY_ALLOWED_KIND[o.cat];
    facilities.forEach(function (f) {
      if (f.accepts.indexOf(o.mat) < 0) { fail.push({ id: f.id, kind: f.kind, why: '材质 ' + o.mat + ' 不在接收目录' }); return; }
      if (kinds && kinds.indexOf(f.kind) < 0) { fail.push({ id: f.id, kind: f.kind, why: '类别 ' + o.cat + ' 不允许该类设施' }); return; }
      if (PREPROCESS_REQUIRED.indexOf(o.cat) >= 0 && f.kind !== '泥浆预处理') { fail.push({ id: f.id, kind: f.kind, why: '泥浆必须先经预处理' }); return; }
      pass.push(f);
    });
    tr[o.id] = { pass: pass, fail: fail };
  });
  return tr;
}

function buildManifests(merged, omap) {
  var out = [], n = 0;
  merged.forEach(function (r, i) {
    r.seq.forEach(function (s) {
      n++;
      var o = omap[s.id];
      out.push({ no: 'SR' + String(n).padStart(5, '0'), trip: i + 1, cat: o.cat, from: o.id, to: r.depot, tons: o.tons, arrive: hhmm(r.arrive) });
    });
  });
  return out;
}

function solve() {
  var auto = [], manual = [];
  S.orders.forEach(function (o) {
    if (o.conf < S.params.confGate) manual.push(o); else auto.push(o);
  });
  var om = {}; S.orders.forEach(function (o) { om[o.id] = o; });
  S.omap = om;
  var matchTrace = buildMatchTrace(S.orders, S.facilities);
  var schedulable = S.orders.slice();
  var direct = allDirect(schedulable, S.facilities, S.vehicles, om, S.params);
  var directPlan = direct;
  var cons = consolidate(direct, S.facilities, S.vehicles, om, S.params);
  var coverageAdded = ensureCoverage(cons.routes, S.orders, S.facilities, S.vehicles, om, S.params);
  // Hard guarantee: even if the previous pass missed anything (e.g. infeasible spawn),
  // append a shrunken feasible trip so no task is left unresolved.
  if (coverageAudit(cons.routes, S.orders).missing.length) {
    var before = cons.routes.length;
    ensureCoverage(cons.routes, S.orders, S.facilities, S.vehicles, om, S.params, true);
    if (cons.routes.length === before) throw new Error('任务覆盖兜底失败');
  }
  var coverage = coverageAudit(cons.routes, S.orders);
  if (coverage.missing.length) throw new Error('任务覆盖校验失败: ' + coverage.missing.join(','));
  var cands = [];
  cons.trace.forEach(function (t) { t.rows.forEach(function (r) { if (r.pair.length === 2) cands.push({ a: r.pair[0], b: r.pair[1] }); }); });
  S.traceCandidates = cands;
  S.solved = {
    auto: schedulable, manual: manual, matchTrace: matchTrace,
    directPlan: directPlan, optimizedPlan: cons.routes,
    direct: directPlan, mBase: metrics(directPlan),
    merged: cons.routes, mMerged: metrics(cons.routes),
    trace: cons.trace, manifests: buildManifests(cons.routes, om),
    coverage: coverage, coverageAdded: coverageAdded
  };
}

function selectTrip(i) { S.sel = { kind: 'trip', id: i }; render(); }
function selectFacility(id) { S.sel = { kind: 'fac', id: id }; render(); }
function selectOrder(id) { S.sel = { kind: 'order', id: id }; render(); }
function selectStep(id) { S.sel = { kind: 'step', id: id }; render(); }

function render() {
  const root = document.getElementById('srs-demo');
  root.innerHTML = '';

  // 顶栏
  const top = el('div', 'srs-top');
  top.appendChild(el('div', 'srs-title', '建筑垃圾运输调度<br><small>CONSTRUCTION WASTE ROUTING</small>'));
  const cw = el('div', 'srs-cities');
  CITY_ORDER.forEach(function (k) {
    const b = el('button', null, CITY_LABEL[k]);
    b.type = 'button';
    b.setAttribute('aria-pressed', k === S.cityKey ? 'true' : 'false');
    b.addEventListener('click', function () { switchCity(k); });
    cw.appendChild(b);
  });
  top.appendChild(cw);
  top.appendChild(el('span', 'srs-badge', '示例数据 · 坐标真实'));
  const pb = el('button', 'srs-topbtn', '参数');
  pb.type = 'button';
  pb.addEventListener('click', function () { toggleParams(); });
  top.appendChild(pb);
  root.appendChild(top);

  if (S.showParams) root.appendChild(paramPanel());

  if (!S.candSpots) S.candSpots = candidateSpots();

  // 视图切换（动态地图 / 直送 / 对比）
  const view = S.view || 'optimized';
  const vb = el('div', 'srs-viewbar');
  [['optimized', '算法优化（动态）'], ['direct', '点对点直送'], ['compare', '直送 / 优化对比']].forEach(function (pair) {
    const b = el('button', 'srs-vbtn', pair[1]);
    b.type = 'button';
    b.setAttribute('aria-pressed', view === pair[0] ? 'true' : 'false');
    b.addEventListener('click', function () { S.view = pair[0]; S.sel = null; render(); });
    vb.appendChild(b);
  });
  root.appendChild(vb);

  if (view === 'compare') {
    root.appendChild(compareSection(S));
  } else {
    const main = el('div', 'srs-main');
    const mapWrap = el('div', 'srs-map');
    main.appendChild(mapWrap);
    const side = el('div', 'srs-side');
    main.appendChild(side);
    root.appendChild(main);

    const isDirect = view === 'direct';
    drawMap(mapWrap, S, {
      animate: true,
      direct: isDirect,
      routes: isDirect ? (S.solved.directPlan || S.solved.direct) : S.solved.merged,
      candidates: isDirect ? [] : S.traceCandidates
    });
    if (S.sel) renderDetail(side, S); else renderGlobalSide(side, S);

    // 图例
    const lg = el('div', 'srs-legend');
    mapWrap.appendChild(lg);
    CATS.forEach(function (c) { lg.appendChild(el('span', null, '<i style="background:' + CAT_COLOR[c] + '"></i>' + c)); });
    Object.keys(KIND_COLOR).forEach(function (k) { lg.appendChild(el('span', null, '<i style="background:' + KIND_COLOR[k] + '"></i>' + k)); });
    Object.keys(ROAD_PROFILES).forEach(function (k) {
      var rp = ROAD_PROFILES[k];
      lg.appendChild(el('span', null, '<i style="background:' + rp.color + '"></i>路况·' + rp.label + ' ×' + rp.speedFactor.toFixed(2)));
    });
    if (isDirect) lg.appendChild(el('span', null, '<i style="background:#b95c33"></i>点对点直送'));
    else lg.appendChild(el('span', null, '<i style="background:#4472c4"></i>算法优化路线'));
  }
}
/* ===== params + city switch + boot ===== */

function paramPanel() {
  const w = el('div', 'srs-sec');
  w.appendChild(el('h3', null, '参数（滑动后松手生效）'));
  const defs = [
    ['fixedTripCost', '出车固定成本 元/趟', 0, 300, 10],
    ['costPerKm', '里程单价 元/km', 1, 20, 0.5],
    ['speedKmh', '基础车速 km/h', 15, 70, 1],
    ['roadConditionImpact', '路况影响权重', 0, 1.5, 0.1],
    ['loadMinPerT', '装货 min/吨', 0.5, 8, 0.5],
    ['processMinPerT', '处理 min/吨', 0, 6, 0.2],
    ['difficultyImpact', '处理难度影响权重', 0, 1.5, 0.1],
    ['waitCostPerH', '等待 元/小时', 0, 200, 10],
    ['latePenaltyPerH', '违约 元/小时', 0, 600, 50],
    ['handleCostPerT', '操作 元/吨', 0, 10, 0.5],
    ['turnAroundMin', '任务间隔周转 min', 0, 120, 5],
    ['confGate', '置信度门槛', 0.3, 0.99, 0.01]
  ];
  defs.forEach(function (d) {
    const line = el('div', 'srs-row');
    line.innerHTML = '<b>' + d[1] + '</b>：<span class="num" id="pv-' + d[0] + '">' + S.params[d[0]] + '</span>';
    const r = el('input');
    r.type = 'range'; r.min = d[2]; r.max = d[3]; r.step = d[4]; r.value = S.params[d[0]];
    r.setAttribute('aria-label', d[1]);
    r.addEventListener('input', function () {
      S.params[d[0]] = parseFloat(r.value);
      document.getElementById('pv-' + d[0]).textContent = r.value;
    });
    r.addEventListener('change', function () { solve(); render(); });
    line.appendChild(r);
    w.appendChild(line);
  });
  return w;
}
function toggleParams() { S.showParams = !S.showParams; render(); }

function switchCity(k) {
  S.cityKey = k;
  S.city = DATA[k];
  S.geo = GEO[k];
  const enriched = enrichCityData(k, DATA[k]);
  S.facilities = enriched.facilities;
  S.orders = enriched.orders;
  S.roadMap = enriched.roadMap;
  S.vehicles = makeVehicles(S.city);
  S.dmap = {}; S.facilities.forEach(function (f) { S.dmap[f.id] = f; });
  S.vmap = {}; S.vehicles.forEach(function (v) { S.vmap[v.id] = v; });
  S.sel = null;
  solve();
  render();
}

function addOrder(d) {
  const n = S.orders.length + 1;
  S.orders.push({
    id: 'N' + n, cat: d.cat, mat: d.mat, tons: d.tons || 4.5, vol: +((d.tons || 4.5) * 1.2).toFixed(1),
    district: d.district, lat: d.lat, lng: d.lng,
    road_condition_key: (S.roadMap[d.district] || ROAD_PROFILES.normal).key,
    road_condition: (S.roadMap[d.district] || ROAD_PROFILES.normal).label,
    road_speed_factor: (S.roadMap[d.district] || ROAD_PROFILES.normal).speedFactor,
    ready: 480, deadline: 1020, conf: d.conf || 0.90
  });
  solve(); render();
}
function removeOrder(id) {
  S.orders = S.orders.filter(function (o) { return o.id !== id; });
  if (S.sel && S.sel.kind === 'order' && S.sel.id === id) S.sel = null;
  solve(); render();
}

function boot() {
  S.params = Object.assign({}, DEFAULT_PARAMS);
  switchCity('beijing');
}

document.addEventListener('DOMContentLoaded', function () { boot(); });

function candidateSpots() {
  var out = [], fs_ = S.facilities;
  var cats = ["工程渣土","工程泥浆","工程垃圾","拆除垃圾","装修垃圾"];
  var mats = { "工程渣土":["土与泥浆"], "工程泥浆":["土与泥浆"], "工程垃圾":["混凝土砖瓦","金属"], "拆除垃圾":["混凝土砖瓦","金属"], "装修垃圾":["木材","塑料","石膏","混凝土砖瓦"] };
  S.geo.districts.slice(0, 4).forEach(function (d, i) {
    var g = d.geometry;
    var r = ringsOf(g)[0];
    var c = { lng: 0, lat: 0 };
    r.forEach(function (p) { c.lng += p[0]; c.lat += p[1]; });
    c.lng /= r.length; c.lat /= r.length;
    var cat = cats[i % cats.length];
    var m = mats[cat][i % mats[cat].length];
    out.push({ district: d.name, lat: +c.lat.toFixed(5), lng: +c.lng.toFixed(5), cat: cat, mat: m });
  });
  return out;
}
function addOrderAt(lat, lng, district) {
  var cat = S.pendingCat || "工程垃圾";
  var mats = { "工程渣土":["土与泥浆"], "工程泥浆":["土与泥浆"], "工程垃圾":["混凝土砖瓦","金属"], "拆除垃圾":["混凝土砖瓦","金属"], "装修垃圾":["木材","塑料","石膏","混凝土砖瓦"] };
  var mat = mats[cat][0];
  var n = S.orders.length + 1;
  var rp = S.roadMap[district] || ROAD_PROFILES.normal;
  S.orders.push({ id: "N" + n, cat: cat, mat: mat, tons: 4.5, vol: 5.5, district: district, lat: lat, lng: lng, road_condition_key: rp.key, road_condition: rp.label, road_speed_factor: rp.speedFactor, ready: 480, deadline: 1020, conf: 0.90 });
  solve(); S.addMode = false; render();
}

</script>
